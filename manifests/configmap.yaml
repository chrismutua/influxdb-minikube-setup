apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-config
  namespace: monitoring
data:
  telegraf.conf: |+
    [agent]
      interval = "30s"
      round_interval = true
      metric_batch_size = 1000
      metric_buffer_limit = 10000
      collection_jitter = "0s"
      flush_interval = "10s"
      flush_jitter = "0s"
      precision = ""
      hostname = "$HOSTNAME"
      omit_hostname = false

    [[outputs.influxdb_v2]]
      urls = ["http://host.minikube.internal:8086"]
      token = "${INFLUXDB_TOKEN}"
      organization = "${INFLUXDB_ORG}"
      bucket = "telegraf"

    [[inputs.kubernetes]]
      url = "https://$HOSTIP:10250"
      bearer_token = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      insecure_skip_verify = true
      ## fieldinclude is a modifier: only the listed fields are kept, and a metric
      ## whose fields are all filtered out is discarded entirely. Field names are
      ## per-measurement; node network is network_*_bytes while pod network is
      ## rx_bytes/tx_bytes.
      fieldinclude = [
        "cpu_usage_nanocores",       # kubernetes_node, kubernetes_pod_container, kubernetes_system_container
        "memory_working_set_bytes",  # kubernetes_node, kubernetes_pod_container, kubernetes_system_container
        "network_rx_bytes",          # kubernetes_node
        "network_tx_bytes",          # kubernetes_node
        "rx_bytes",                  # kubernetes_pod_network
        "tx_bytes",                  # kubernetes_pod_network
        "available_bytes",           # kubernetes_pod_volume
        "capacity_bytes",            # kubernetes_pod_volume
        "used_bytes",                # kubernetes_pod_volume
      ]
